{% extends "base.html" %}

{% block content %}
<div class="round-page-container">
    <div class="game-container">
        <h2>Round {{ round_number + 1 }}</h2>
        <div id="cues" class="queues-{{ round_data.queues|length }}">
            {% for cue in round_data.queues %}
                <button class="cue-button {% if not cue.active %}inactive{% endif %}" 
                        data-color="{{ cue.color }}" 
                        data-quadrant="{{ cue.quadrant }}"
                        {% if not cue.active %}disabled{% endif %}>
                    {% if cue.active %}{{ cue.name }}{% endif %}
                </button>
            {% endfor %}
        </div>
    </div>
</div>

<script>
    var roundNumber = {{ round_number }};
    var sessionId = "{{ session.get('game_id', '') }}";
    
    function logChoice(button, cueName, cueColor) {
        var quadrant = button.getAttribute('data-quadrant');
        var timestamp = new Date();
        
        // Get information about occluded cues
        var allCues = document.querySelectorAll('.cue-button');
        var occludedCues = [];
        var activeCues = [];
        
        allCues.forEach(function(cue, index) {
            var cueQuadrant = parseInt(cue.getAttribute('data-quadrant'));
            if (cue.disabled || cue.classList.contains('inactive')) {
                occludedCues.push(cueQuadrant);
            } else {
                activeCues.push(cueQuadrant);
            }
        });
        
        var logData = {
            type: 'choice',
            round: roundNumber,
            quadrant: parseInt(quadrant),
            cue_name: cueName,
            color: cueColor,
            client_timestamp: timestamp.toISOString(),
            choice_number: document.querySelectorAll('[data-clicked="true"]').length,
            occluded_cues: occludedCues,
            active_cues: activeCues,
            total_cues: allCues.length
        };

        fetch('/log_choice', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'X-Session-ID': sessionId
            },
            body: JSON.stringify(logData)
        })
        .then(function(response) {
            if (!response.ok) {
                console.error("Logging failed");
            }
        })
        .catch(function(error) {
            console.error("Logging error:", error);
        });
    }
    
    function goNext() {
        var nextRound = {{ round_number + 1 }};
        window.location.href = "/round/" + nextRound;
    }
    
    document.querySelectorAll('.cue-button:not(.inactive)').forEach(function(button) {
        button.addEventListener('click', function() {
            if (this.getAttribute('data-clicked') === 'true') return;
            
            var color = this.getAttribute('data-color');
            var cueName = this.textContent.trim();
            
            this.style.backgroundColor = color.toLowerCase();
            this.textContent += " (" + color + ")";
            this.setAttribute('data-clicked', 'true');
            
            logChoice(this, cueName, color);
            
            // Add delay before next round
            setTimeout(goNext, 500);
        });
    });
</script>

<style>
    .round-page-container {
        min-height: calc(100vh - var(--nav-height));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(var(--nav-height) + 2rem - 189px) 1rem 1rem 1rem;
    }

    .round-page-container .game-container {
        margin: 0;
    }

    .cue-button.inactive {
        background-color: #ccc;
        cursor: not-allowed;
        opacity: 0.7;
    }
</style>
{% endblock %}
