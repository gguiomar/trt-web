{% extends "base.html" %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - var(--nav-height)); text-align: center; padding-top: calc(var(--nav-height));">
    <div class="result-container">
        <h1>Game Result</h1>
        
        <p style="font-size: 1rem; margin: 2rem 0;">You chose Cue {{ chosen + 1 }}.</p>
        
        <p style="font-size: 1rem; margin: 2rem 0;">The biased cue was Cue {{ biased + 1 }}.</p>
        
        {% if correct %}
            <p class="result-correct" style="font-size: 1rem;">Correct! You earned +100 points.</p>
        {% else %}
            <p class="result-incorrect" style="font-size: 1rem;">Incorrect. You lost -100 points.</p>
        {% endif %}
        
        <div style="margin-top: 3rem;">
            <a href="{{ url_for('play') }}" class="button">Play Again</a>
        </div>
    </div>
</div>

<style>
.result-container {
    background-color: var(--card-background);
    border: 1px solid var(--border-light);
    border-radius: 12px;
    padding: 3rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    max-width: 500px;
    margin: 0 1rem;
}
</style>
{% endblock %}
